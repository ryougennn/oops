# Publishes every package to nuget.org when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# with Trusted Publishing: no stored API key. One-time setup on nuget.org, under your profile's Trusted
# Publishing: Repository Owner and Repository of this repo, Workflow File "release.yml", Environment "release".
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The "release" environment can require a manual approval before anything is published
    # (repository Settings > Environments > release > Required reviewers).
    environment: release
    permissions:
      id-token: write # lets the job request an OIDC token, which nuget.org exchanges for a one-hour API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        # The integration tests need a headless compositor; tools/ci.sh runs them before tagging.
        run: |
          dotnet test --project tests/oopshell.Tests
          dotnet test --project tests/oopshell.Scanner.Tests
          dotnet test --project tests/oopshell.Services.Tests

      - name: Pack
        run: tools/pack.sh "${GITHUB_REF_NAME#v}"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name (not your email), as a repository secret

      - name: Publish
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
